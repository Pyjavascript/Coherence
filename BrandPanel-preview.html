<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Brand Panel Preview</title>
    <style>
      @import "https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap";
      .bp {
        --navy: #0d1445;
        --ink: #0e1646;
        --card: #f3f6ff;
        --muted: #6e7596;
        --ph: #a9aec9;
        --blue: #0f1ff0;
        --sel: #f3f6ff;
        --gold-head: #d4a44c;
        --gold-text: #a9741e;
        box-sizing: border-box;
        width: 449px;
        max-width: 100%;
        max-height: 100vh;
        overflow-y: auto;
        overflow-x: hidden;
        background: var(--navy);
        border-radius: 32px;
        padding: 18px 17px 22px;
        font-family: Manrope, system-ui, sans-serif;
        color: #fff;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
      }
      .bp *,
      .bp *:before,
      .bp *:after {
        box-sizing: border-box;
        font-family: inherit;
      }
      .bp::-webkit-scrollbar {
        width: 6px;
      }
      .bp::-webkit-scrollbar-thumb {
        background: #ffffff2e;
        border-radius: 6px;
      }
      .bp::-webkit-scrollbar-track {
        background: transparent;
      }
      .bp-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 22px 0 1px;
        height: 40px;
      }
      .bp-title {
        font-size: 26px;
        font-weight: 500;
        letter-spacing: -0.02em;
        margin: 0;
      }
      .bp-iconbtn {
        background: none;
        border: 0;
        color: #fff;
        cursor: pointer;
        padding: 6px;
        display: grid;
        place-items: center;
      }
      .bp-section {
        margin-top: 14px;
      }
      .bp-section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 30px;
        margin: 0 0 12px;
        padding: 0 2px;
      }
      .bp-section-title {
        font-size: 18px;
        font-weight: 500;
        letter-spacing: -0.02em;
        margin: 0;
      }
      .bp-section-head.gold .bp-section-title {
        color: var(--gold-head);
      }
      .bp-section-head button.bp-section-toggle {
        background: none;
        border: 0;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 0 6px 0 0;
        cursor: pointer;
      }
      .bp-chev-toggle {
        transition: transform 0.15s ease;
      }
      .bp-chev-toggle.open {
        transform: rotate(180deg);
      }
      .bp-card {
        background: var(--card);
        border-radius: 28px;
        padding: 16px 17px 17px;
        color: var(--ink);
        position: relative;
      }
      .bp-card.gold {
        background: linear-gradient(
          180deg,
          #fff6ea,
          #f1e0bf 42%,
          #d7b070 78%,
          #c8963a
        );
        padding-bottom: 12px;
      }
      .bp-section.brand .bp-card {
        margin-left: 1px;
      }
      .bp-field {
        margin-bottom: 10px;
        position: relative;
      }
      .bp-field:last-child {
        margin-bottom: 0;
      }
      .bp-label-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0 0 6px;
      }
      .bp-label {
        font-size: 16px;
        font-weight: 400;
        color: var(--muted);
        letter-spacing: -0.02em;
        display: block;
        margin: 0 0 6px;
        padding-left: 1px;
      }
      .bp-label-row .bp-label {
        margin: 0;
      }
      .bp-tag {
        font-size: 14px;
        font-weight: 500;
        color: var(--blue);
        padding-right: 6px;
      }
      .bp-row2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .bp-input,
      .bp-textarea {
        width: 100%;
        background: #fff;
        border: 1px solid transparent;
        border-radius: 28px;
        font-size: 14px;
        font-weight: 500;
        color: var(--ink);
        outline: none;
        padding: 0 22px;
      }
      .bp-input {
        height: 57px;
      }
      .bp-textarea {
        padding: 14px 22px;
        min-height: 68px;
        resize: none;
        line-height: 1.35;
        display: block;
      }
      .bp-input::placeholder,
      .bp-textarea::placeholder {
        color: var(--ph);
        font-weight: 400;
      }
      .bp-input:focus,
      .bp-textarea:focus {
        border-color: #c9d2ff;
      }
      .bp-inline {
        position: relative;
      }
      .bp-inline .bp-input {
        padding-right: 110px;
      }
      .bp-addimg {
        position: absolute;
        right: 22px;
        top: 0;
        height: 100%;
        display: flex;
        align-items: center;
        background: none;
        border: 0;
        color: var(--blue);
        font-size: 12px;
        font-weight: 600;
        text-decoration: underline;
        cursor: pointer;
        max-width: 100px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding: 0;
      }
      .bp-dd {
        position: relative;
      }
      .bp-dd.open {
        z-index: 60;
      }
      .bp-dd-trigger {
        width: 100%;
        height: 57px;
        background: #fff;
        border: 1px solid transparent;
        border-radius: 28px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 22px;
        cursor: pointer;
        color: var(--ink);
        font-size: 18px;
        font-weight: 700;
        text-align: left;
      }
      .bp-dd-trigger:focus-visible {
        border-color: #c9d2ff;
        outline: none;
      }
      .bp-dd-value {
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .bp-dd.center .bp-dd-value {
        text-align: center;
      }
      .bp-dd-chev {
        color: #1b2a8c;
        flex: none;
        display: grid;
        place-items: center;
        transition: transform 0.15s ease;
      }
      .bp-dd.open .bp-dd-chev {
        transform: rotate(180deg);
      }
      .bp-dd-lock {
        color: #c99a45;
        flex: none;
        display: grid;
        place-items: center;
      }
      .bp-dd-menu {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        right: 0;
        z-index: 70;
        background: #fff;
        border-radius: 28px;
        padding: 8px 12px;
        max-height: 330px;
        overflow-y: auto;
        box-shadow:
          0 12px 40px #0a124647,
          0 2px 8px #0a12461a;
        scrollbar-width: thin;
        scrollbar-color: #d5dbf5 transparent;
        margin: 0;
        list-style: none;
      }
      .bp-dd-menu::-webkit-scrollbar {
        width: 5px;
      }
      .bp-dd-menu::-webkit-scrollbar-thumb {
        background: #d5dbf5;
        border-radius: 5px;
      }
      .bp-dd-opt {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 12px 14px;
        border-radius: 22px;
        min-height: 44px;
        font-size: 16px;
        font-weight: 700;
        color: var(--ink);
        cursor: pointer;
      }
      .bp-dd-opt:hover {
        background: #f8f9ff;
      }
      .bp-dd-opt.selected {
        background: var(--sel);
      }
      .bp-dd-opt.disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .bp-dd-opt.disabled:hover {
        background: transparent;
      }
      .bp-dd-opt.selected.disabled {
        opacity: 1;
      }
      .bp-dd-check {
        color: var(--ink);
        display: grid;
        place-items: center;
      }
      .bp-actions {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }
      .bp-del {
        width: 58px;
        height: 58px;
        border-radius: 22px;
        border: 0;
        background: red;
        color: #fff;
        display: grid;
        place-items: center;
        cursor: pointer;
        flex: none;
      }
      .bp-save {
        flex: 1;
        height: 58px;
        border-radius: 22px;
        border: 0;
        background: #00c95a;
        color: #fff;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .bp-save.saved {
        background: #00a84a;
      }
      .bp-premium-note {
        margin: 10px 0 0 1px;
        font-size: 12px;
        font-weight: 500;
        color: var(--gold-text);
      }
      .bp-premium-note.flash {
        font-weight: 800;
      }
      .bp-research {
        width: 100%;
        height: 57px;
        background: #fff;
        border: 1px solid transparent;
        border-radius: 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px 0 22px;
        cursor: pointer;
        font-size: 14px;
        color: var(--ph);
      }
      .bp-research:focus-visible,
      .bp-research:active {
        border-color: #c9d2ff;
        outline: none;
      }
      .bp-research b {
        font-size: 20px;
        font-weight: 500;
        color: var(--ink);
      }
      .bp-external {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 18px 1px 0 18px;
      }
      .bp-external span {
        font-size: 18px;
        font-weight: 500;
        letter-spacing: -0.02em;
      }
      .bp-copy {
        height: 57px;
        min-width: 162px;
        border-radius: 24px;
        border: 1px solid #fff;
        background: #fff;
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 0 22px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
      .bp-gen {
        margin: 22px 3px 0 6px;
        background: #0a52ff;
        border-radius: 28px;
        padding: 24px 22px 22px;
        color: #fff;
      }
      .bp-gen-top {
        display: flex;
        gap: 20px;
        align-items: center;
        padding-left: 4px;
      }
      .bp-gen-top h3 {
        margin: 0;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: -0.02em;
      }
      .bp-gen-top p {
        margin: 2px 0 0;
        font-size: 14px;
        font-weight: 500;
      }
      .bp-gen-btn {
        width: 100%;
        margin-top: 20px;
        height: 66px;
        border-radius: 30px;
        border: 0;
        background: #fff;
        color: var(--ink);
        font-size: 18px;
        font-weight: 500;
        cursor: pointer;
      }
      .bp-gen-btn:disabled {
        opacity: 0.7;
        cursor: progress;
      }
      .bp-hook {
        margin-top: 16px;
        background: #ffffff24;
        border-radius: 20px;
        padding: 14px 18px;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.45;
      }

      html,
      body {
        margin: 0;
        background: #e9ecf5;
        min-height: 100vh;
      }
      #root {
        display: flex;
        justify-content: center;
        padding: 24px 0;
      }
    </style>
  </head>
