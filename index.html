<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Brand Language OS</title>
    <script>
      // Appearance (src/lib/theme.js), applied before the first paint.
      (function () {
        var pref = "light";
        try { pref = localStorage.getItem("coherence.theme") || "light"; } catch (e) {}
        if (pref === "system") pref = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", pref === "dark" ? "dark" : "light");
      })();
    </script>
    <link rel="icon" href="./src/assets/sidebar/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
