<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Modal QA harness</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/index-CiXxvpMo.css">
<link rel="stylesheet" href="/polish/tokens.css?v=3">
<link rel="stylesheet" data-polish href="/polish/shell.css">
<link rel="stylesheet" data-polish href="/polish/modals.css?v=30">
<link rel="stylesheet" data-polish href="/polish/radius.css?v=1">
<style>html,body{margin:0;height:100%}</style>
</head><body>
<div id="root"><div class="app"><div id="stage"></div></div></div>
<script>
const X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5 5 19"/></svg>';
const COPY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="8.5" y="8.5" width="12" height="12" rx="3.5"/><path d="M15.5 8.5V7a3.5 3.5 0 0 0-3.5-3.5H7A3.5 3.5 0 0 0 3.5 7v5A3.5 3.5 0 0 0 7 15.5h1.5"/></svg>';
const WARN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 4.2 2.8 17.5A2 2 0 0 0 4.5 20.5h15a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0z"/><path d="M12 9.5v4.5"/><path d="M12 17.2h.01"/></svg>';
const long = new URLSearchParams(location.search).get('long')==='1';
const lorem='Everything generated for this brand, newest first. Lorem ipsum dolor sit amet consectetur adipiscing elit.';
const entries=(n)=>Array.from({length:n},(_,i)=>`<article class="history-entry" style="--node-color:#4653ff"><header class="history-entry-head"><span class="history-pill"><i></i>Email</span><time>${i+1}h ago</time></header><p class="history-context">“Announce the new fragrance to warm subscribers”</p><div class="history-items"><p class="history-item">Subject: Something new has arrived for you</p><p class="history-item">Preview: Meet the scent you have been waiting for.</p></div><div class="history-actions"><button>Copy</button><button class="is-primary">Restore to grid</button></div></article>`).join('');
const notes=(n)=>Array.from({length:n},(_,i)=>`<article class="research-note-card"><div class="research-note-body"><h3>Competitor</h3><p>Paste a competitor line, review quote, trend, or keyword number ${i+1} that is long enough to wrap onto two lines in the card.</p></div><button aria-label="Delete">${X}</button></article>`).join('');
const M={
 profile:`<section class="profile-modal" role="dialog"><form><div class="profile-banner"><button type="button" class="profile-close" aria-label="Close">${X}</button></div><div class="profile-head"><button type="button" class="profile-photo-trigger"><span style="width:76px;height:76px;border-radius:50%;background:#2b308b;display:block"></span></button><button type="button" class="profile-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17l5-5-5-5M15 12H3M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/></svg>Log out</button></div><div class="profile-id"><h2>Natasha Gandhi</h2><p>namitg3006@gmail.com</p></div><div class="profile-rows"><div class="profile-row" role="group"><span class="profile-row-label">Name</span><div class="profile-name-fields"><input class="profile-input" aria-label="First name" placeholder="First name" value="Natasha"><input class="profile-input" aria-label="Last name" placeholder="Last name" value="Gandhi"></div></div><div class="profile-row"><label class="profile-row-label">Email address</label><div class="profile-input-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg><input class="profile-input" value="namitg3006@gmail.com" readonly></div></div></div><section class="plugin-access"><button type="button" class="pa-trigger"><span class="pa-heading"><span class="pa-title">Figma plugin</span><span class="pa-sub">Use your brands inside Figma</span></span></button></section>${long?Array.from({length:6},()=>'<div class="profile-rows"><div class="profile-row"><span class="profile-row-label">Extra</span><input class="profile-input"></div></div>').join(''):''}<div class="profile-actions"><button type="button" class="profile-delete">${WARN}Delete account</button><div class="profile-actions-end"><button type="button" class="profile-cancel">Cancel</button><button type="submit" class="profile-save" disabled>Save changes</button></div></div></form></section>`,
 'profile-confirm':`<section class="profile-modal profile-confirm" role="alertdialog"><span class="confirm-icon">${WARN}</span><h2 class="confirm-title">Delete your account?</h2><div class="confirm-text"><p class="confirm-body">All saved brands, research notes, and generation history associated with <b>namitg3006@gmail.com</b> will be permanently deleted.</p><p class="confirm-note">This can't be undone.</p></div><div class="confirm-actions"><button class="confirm-cancel">Keep account</button><button class="confirm-ok is-danger">Delete account</button></div></section>`,
 usage:`<section class="profile-modal usage-modal" role="dialog"><header class="usage-head"><span class="usage-head-icon"></span><div class="usage-head-text"><h2>Usage</h2><p>Free plan · resets daily at 5:30</p></div><button type="button" class="profile-close usage-close" aria-label="Close">${X}</button></header><div class="usage-body"><div class="uc-section-label"><span>Credits</span><span>Today at 12:12</span></div><div class="uc-card"><div class="uc-summary"><p class="uc-big"><b>5</b><span>credits used</span></p><span class="uc-left is-ok"><b>35</b> of 40 left</span></div><div role="meter"><div class="uc-lines" style="--count:40">${Array.from({length:40},(_,i)=>`<i${i<5?' class="is-node"':''} style="--i:${i}"></i>`).join('')}</div></div><div class="uc-legend"><div class="uc-legend-item is-quick"><span>Quick Grid</span><b>0</b></div><div class="uc-legend-item is-node"><span>Node Studio</span><b>5</b></div><div class="uc-legend-item is-regen"><span>Regenerations</span><b>0</b></div><div class="uc-legend-item is-hook"><span>Hooks</span><b>0</b></div></div><div class="uc-row"><span>Brands</span><span>1 of 2</span></div><div class="uc-row"><span>Free hooks today</span><span>1 of 1 left</span></div></div><div class="usage-section"><div class="usage-section-head"><h3>Choose a model</h3><div class="usage-key"><button type="button" class="usage-key-btn" aria-label="Add your OpenAI API key"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.8-9.8"/></svg></button></div></div><div class="usage-models" role="radiogroup">${[['gpt-4o-mini','Fastest','Faster for everyday tasks',0],['gpt-4o','Recommended','Best balance of speed and quality',1],['gpt-4.1','Most capable','Best for complex tasks',0]].map(([n,t,d,on])=>`<button type="button" role="radio" aria-checked="${!!on}" class="usage-model${on?' is-on':''}"><span class="usage-model-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span><span class="usage-model-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></svg></span><span class="usage-model-name">${n}</span><span class="usage-model-tag">${t}</span><span class="usage-model-desc">${d}</span></button>`).join('')}</div></div></div><div class="profile-actions usage-actions"><button type="button" class="profile-save">Done</button></div></section>`,
 history:`<section class="modal research-modal history-modal" role="dialog"><div class="modal-head"><h3>History</h3><button type="button" aria-label="Close">${X}</button></div><p class="hook-description">${lorem}</p><div class="history-filters"><button class="on">All</button><button>Email</button><button>Website</button></div><div class="history-list research-panel">${entries(long?8:2)}</div></section>`,
 confirm:`<section class="confirm-dialog is-danger" role="alertdialog"><span class="confirm-icon">${WARN}</span><h2 class="confirm-title">Delete this brand?</h2><div class="confirm-text"><p class="confirm-body">This brand and everything generated for it will be removed.</p><p class="confirm-note">This can't be undone.</p></div><div class="confirm-actions"><button class="confirm-cancel">Cancel</button><button class="confirm-ok is-danger">Delete</button></div></section>`,
 auth:`<section class="modal auth-modal" role="dialog"><div class="modal-head"><h3>Welcome back!</h3><button type="button" aria-label="Close">${X}</button></div><p class="modal-subtitle">Need an account? <button type="button" class="auth-switch">Sign up</button></p><div class="auth-card"><button class="auth-google">Sign in with Google</button><div class="auth-divider"><span>or</span></div><form class="auth-form"><div class="auth-field"><label>Email address</label><input placeholder="example@gmail.com"></div><div class="auth-field"><label>Password</label><input type="password"></div><div class="auth-field"><label>Confirm Password</label><input type="password"></div><button class="auth-submit" type="button">Create Account</button></form></div></section>`,
 coherence:`<section class="coherence-modal" role="dialog"><header class="coherence-header"><h2>Coherence Prompt</h2><div class="coherence-header-actions"><button class="coherence-close" type="button" aria-label="Close">${X}</button></div></header><div class="coherence-content"><p class="coherence-description">Paste into any LLM to check CTA and body copy alignment.</p><div class="coherence-panel"><textarea class="coherence-prompt">${'You are a brand-copy auditor. Check whether the CTA and body copy are aligned with the brand message. '.repeat(long?30:6)}</textarea><button class="coherence-copy" type="button"><span>Copy Prompt</span>${COPY}</button></div></div></section>`,
 research:`<section class="modal research-modal" role="dialog"><div class="modal-head"><h3>Research Notes</h3><button type="button" aria-label="Close">${X}</button></div><div class="research-modal-content"><div class="research-panel"><div class="research-field"><textarea placeholder="Paste a competitor line, review quote, trend, or keyword..."></textarea></div><button class="research-add" type="button">Add notes</button><div class="research-notes-list">${notes(long?8:2)}</div></div></div></section>`,
 hook:`<section class="modal hook-modal" role="dialog"><div class="modal-head"><h3>Hook Generator</h3><button type="button" aria-label="Close">${X}</button></div><div class="hook-modal-content"><p class="hook-description">Describe the moment. Get a brand-aligned hook.</p><div class="hook-panel"><label class="hook-label">What should this hook be about?</label><textarea class="hook-brief" placeholder="Describe the moment, audience, or idea…"></textarea><button class="hook-generate" type="button">Generate hook</button><section class="hook-result"><span class="hook-result-label">Your hook</span><div class="hook-result-message">Your generated hook will appear here.</div></section><button class="hook-copy" type="button">Copy hook ${COPY}</button></div></div></section>`,
};
const name=new URLSearchParams(location.search).get('m')||'profile';
document.getElementById('stage').innerHTML=`<div class="overlay ${name==='auth'?'auth-overlay':''}">${M[name]}</div>`;
// emulate the app: Save is enabled once a name differs from its original value
document.querySelectorAll('.profile-name-fields').forEach(f=>{const ins=[...f.querySelectorAll('input')];const base=ins.map(i=>i.value);const save=document.querySelector('.profile-save');ins.forEach(i=>i.addEventListener('input',()=>{if(save)save.disabled=ins.every((x,k)=>x.value.trim()===base[k]);}));});
</script><script src="/polish/motion.js"></script><script src="/polish/modals.js"></script><script src="/polish/account.js"></script></body></html>
